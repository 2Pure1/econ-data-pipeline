id: macro_ingestion_pipeline
namespace: econ.pipelines

description: |
  Monthly macroeconomic data ingestion pipeline.
  Runs BEA + FRED + BLS ingestion in parallel,
  then refreshes dbt models and runs data quality tests.

labels:
  project: econ-data-pipeline
  layer: ingestion
  schedule: monthly

triggers:
  - id: monthly_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 2 * *" # 2nd of every month at 8am UTC

inputs:
  - name: start_year
    type: INT
    defaults: 1990
  - name: destination
    type: STRING
    defaults: postgres

variables:
  project_dir: /project
  dbt_dir: /project/dbt_project

tasks:
  - id: ingestion_parallel
    type: io.kestra.plugin.core.flow.Parallel
    tasks:
      - id: ingest_bea
        type: io.kestra.plugin.scripts.python.Commands
        runner: PROCESS
        beforeCommands:
          - pip install -r /project/requirements.txt
        env:
          BEA_API_KEY: "{{ envs.bea_api_key }}"
          POSTGRES_HOST: "{{ envs.postgres_host }}"
          POSTGRES_DB: "{{ envs.postgres_db }}"
          POSTGRES_USER: "{{ envs.postgres_user }}"
          POSTGRES_PASSWORD: "{{ envs.postgres_password }}"
        commands:
          - python /project/ingestion/bea_pipeline.py --destination {{ inputs.destination }} --start {{ inputs.start_year }}

      - id: ingest_fred
        type: io.kestra.plugin.scripts.python.Commands
        runner: PROCESS
        beforeCommands:
          - pip install -r /project/requirements.txt
        env:
          FRED_API_KEY: "{{ envs.fred_api_key }}"
          POSTGRES_HOST: "{{ envs.postgres_host }}"
          POSTGRES_DB: "{{ envs.postgres_db }}"
          POSTGRES_USER: "{{ envs.postgres_user }}"
          POSTGRES_PASSWORD: "{{ envs.postgres_password }}"
        commands:
          - python /project/ingestion/fred_pipeline.py --destination {{ inputs.destination }} --start {{ inputs.start_year }}-01-01

  - id: write_delta_lake
    type: io.kestra.plugin.scripts.python.Commands
    runner: PROCESS
    beforeCommands:
      - pip install -r /project/requirements.txt
    env:
      DELTA_S3_PATH: "{{ envs.delta_s3_path }}"
      AWS_ACCESS_KEY_ID: "{{ envs.aws_access_key_id }}"
      AWS_SECRET_ACCESS_KEY: "{{ envs.aws_secret_access_key }}"
    commands:
      - python /project/delta_lake/delta_writer.py --table all --mode merge

  - id: dbt_run
    type: io.kestra.plugin.scripts.shell.Commands
    description: Run dbt full refresh after ingestion
    runner: PROCESS
    beforeCommands:
      - pip install dbt-postgres
    commands:
      - cd {{ vars.dbt_dir }}
      - dbt run --full-refresh --profiles-dir . --target dev
    env:
      POSTGRES_HOST: "{{ envs.postgres_host }}"
      POSTGRES_PASSWORD: "{{ envs.postgres_password }}"

  - id: dbt_test
    type: io.kestra.plugin.scripts.shell.Commands
    description: Run dbt data quality tests
    runner: PROCESS
    commands:
      - cd {{ vars.dbt_dir }}
      - dbt test --profiles-dir . --target dev
    env:
      POSTGRES_HOST: "{{ envs.postgres_host }}"
      POSTGRES_PASSWORD: "{{ envs.postgres_password }}"
