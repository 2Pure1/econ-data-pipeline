version: 2

models:

  - name: stg_fred_observations
    description: >
      Deduplicated and type-cast FRED series observations.
      Adds observation_month and observation_quarter date spine columns
      for joining with BEA quarterly data and market monthly aggregates.
    columns:
      - name: series_id
        description: "FRED series identifier"
        tests:
          - not_null
      - name: observation_date
        description: "Date of observation (DATE type)"
        tests:
          - not_null
      - name: observation_month
        description: "First day of the observation month (DATE)"
        tests:
          - not_null
      - name: observation_quarter
        description: "First day of the observation quarter (DATE)"
        tests:
          - not_null
      - name: value
        description: "Numeric series value; null when originally missing"
      - name: is_missing
        description: "True when the FRED observation was reported as missing"
        tests:
          - not_null
      - name: category
        description: "Series category (inflation, labor, monetary, etc.)"
      - name: units
        description: "Units of measurement"
      - name: frequency
        description: "Observation frequency (daily, monthly, quarterly, weekly)"

  - name: stg_bea_observations
    description: >
      Deduplicated and type-cast BEA NIPA observations.
      Normalises period strings into ISO dates; retains full metadata.
    columns:
      - name: table_key
        description: "Internal table identifier"
        tests:
          - not_null
      - name: series_name
        description: "Series name within the table"
        tests:
          - not_null
      - name: period_date
        description: "ISO date for the start of the observation period (DATE)"
        tests:
          - not_null
      - name: value
        description: "Numeric value; null for suppressed or missing data"
      - name: is_missing
        description: "True when BEA reported missing/suppressed data"
        tests:
          - not_null
      - name: bea_table_name
        description: "BEA internal table code"
      - name: frequency
        description: "Data frequency: A, Q, or M"
      - name: units
        description: "Units from BEA METRIC_NAME field"

  - name: stg_market_prices
    description: >
      Deduplicated and type-cast daily market prices.
      Renames columns to match mart expectations; adds trade_month for
      monthly aggregation joins with macro indicators.
    columns:
      - name: ticker
        description: "Yahoo Finance ticker symbol"
        tests:
          - not_null
      - name: trade_date
        description: "Trading date (DATE type)"
        tests:
          - not_null
      - name: trade_month
        description: "First day of the trading month (DATE) — for monthly joins"
        tests:
          - not_null
      - name: open_price
        description: "Adjusted open price"
      - name: high_price
        description: "Adjusted high price"
      - name: low_price
        description: "Adjusted low price"
      - name: close_price
        description: "Adjusted closing price"
        tests:
          - not_null
      - name: volume
        description: "Trading volume"
      - name: daily_return
        description: "Daily percent return"
      - name: log_return
        description: "Natural log return"
      - name: rolling_vol_20d
        description: "20-day annualised realised volatility"
      - name: category
        description: "Asset category (equity_index, volatility, commodity, etc.)"
      - name: asset_class
        description: "Broad asset class (equity, bonds, commodity, currency, crypto)"
