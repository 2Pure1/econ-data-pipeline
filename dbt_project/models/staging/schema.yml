version: 2

models:

  - name: stg_fred_observations
    description: >
      Deduplicated and type-cast FRED series observations.
      Adds observation_month and observation_quarter date spine columns
      for joining with BEA quarterly data and market monthly aggregates.
    columns:
      - name: series_id
        description: "FRED series identifier"
        tests:
          - not_null
      - name: observation_date
        description: "Date of observation (DATE type)"
        tests:
          - not_null
      - name: observation_month
        description: "First day of the observation month (DATE)"
        tests:
          - not_null
      - name: observation_quarter
        description: "First day of the observation quarter (DATE)"
        tests:
          - not_null
      - name: value
        description: "Numeric series value; null when originally missing"
      - name: is_missing
        description: "True when the FRED observation was reported as missing"
        tests:
          - not_null
      - name: category
        description: "Series category (inflation, labor, monetary, etc.)"
      - name: units
        description: "Units of measurement"
      - name: frequency
        description: "Observation frequency (daily, monthly, quarterly, weekly)"

  - name: stg_bea_observations
    description: >
      Deduplicated and type-cast BEA NIPA observations.
      Normalises period strings into ISO dates; retains full metadata.
    columns:
      - name: table_key
        description: "Internal table identifier"
        tests:
          - not_null
      - name: series_name
        description: "Series name within the table"
        tests:
          - not_null
      - name: period_date
        description: "ISO date for the start of the observation period (DATE)"
        tests:
          - not_null
      - name: value
        description: "Numeric value; null for suppressed or missing data"
      - name: is_missing
        description: "True when BEA reported missing/suppressed data"
        tests:
          - not_null
      - name: bea_table_name
        description: "BEA internal table code"
      - name: frequency
        description: "Data frequency: A, Q, or M"
      - name: units
        description: "Units from BEA METRIC_NAME field"


