name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.1.11

      - name: Run ruff
        run: ruff check ingestion/ delta_lake/ duckdb/ mage/

  # ── Tests ────────────────────────────────────────────────────────────────────
  test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: econ_user
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: econ_warehouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U econ_user -d econ_warehouse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: econ_warehouse
      POSTGRES_USER: econ_user
      POSTGRES_PASSWORD: testpass
      POSTGRES_SCHEMA: raw
      # Dummy API keys — tests mock HTTP calls, no real requests made
      FRED_API_KEY: test-key
      BEA_API_KEY: test-key
      BLS_API_KEY: test-key
      AWS_DEFAULT_REGION: us-east-1
      # Disable S3 archival in tests
      S3_BUCKET_RAW: test-bucket

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install \
            python-dotenv loguru tenacity requests pandas numpy \
            dlt[postgres] psycopg2-binary \
            pytest pytest-cov pytest-mock boto3

      - name: Initialise database schema
        run: |
          PGPASSWORD=testpass psql \
            -h localhost -U econ_user -d econ_warehouse \
            -f docker/scripts/init_db.sql

      - name: Run tests
        run: |
          pytest tests/ \
            --cov=ingestion \
            --cov-report=term-missing \
            --cov-report=xml \
            -v
        # Don't fail the job if there are no tests yet
        continue-on-error: false

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # ── dbt compile ──────────────────────────────────────────────────────────────
  dbt-compile:
    name: dbt compile
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: econ_user
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: econ_warehouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U econ_user -d econ_warehouse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: econ_warehouse
      POSTGRES_USER: econ_user
      POSTGRES_PASSWORD: testpass
      DBT_TARGET: dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dbt
        run: pip install dbt-core==1.7.3 dbt-postgres==1.7.3

      - name: Initialise database schema
        run: |
          PGPASSWORD=testpass psql \
            -h localhost -U econ_user -d econ_warehouse \
            -f docker/scripts/init_db.sql

      - name: dbt compile
        working-directory: dbt_project
        run: dbt compile --profiles-dir . --target dev

  # ── Terraform validate ────────────────────────────────────────────────────────
  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: terraform init
        working-directory: terraform
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: terraform
        run: terraform validate

      - name: terraform fmt check
        working-directory: terraform
        run: terraform fmt -check -recursive

  # ── Docker build ─────────────────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build pipeline image
        run: |
          docker build \
            -f docker/Dockerfile.pipeline \
            -t econ-pipeline:ci \
            .
