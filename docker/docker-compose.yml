# ============================================================
# Econ Data Pipeline — Local Development Stack
# Services: PostgreSQL, Apache Airflow, pgAdmin
#
# Usage:
#   docker compose up -d
#   docker compose down -v   (to destroy volumes)
# ============================================================

x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: docker/Dockerfile.airflow
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://econ_user:${POSTGRES_PASSWORD:-localdev}@postgres:5432/airflow_db
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-dev-secret-key}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    # Pipeline-specific env vars
    PIPELINE_DIR: /app
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DB: ${POSTGRES_DB:-econ_warehouse}
    POSTGRES_USER: ${POSTGRES_USER:-econ_user}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    FRED_API_KEY: ${FRED_API_KEY:-}
    BLS_API_KEY: ${BLS_API_KEY:-}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    S3_BUCKET_RAW: ${S3_BUCKET_RAW:-econ-pipeline-raw-data}
    GOOGLE_APPLICATION_CREDENTIALS: /app/secrets/gcp-credentials.json
    GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
    DBT_PROFILES_DIR: /app/dbt_project
    DBT_TARGET: dev
    AIRFLOW_CONN_SLACK_WEBHOOK: ${AIRFLOW_CONN_SLACK_WEBHOOK:-http://:T07Q1NW7VJS%2FB0AHJJW5QSG%2FvKMj4PCyN95GG8BGUCXu3AdV@https%3A%2F%2Fhooks.slack.com}
  volumes:
    - ..:/app
    - ../airflow/dags:/opt/airflow/dags
    - ../airflow/plugins:/opt/airflow/plugins
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - econ-net

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-econ_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
      POSTGRES_DB: ${POSTGRES_DB:-econ_warehouse}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-econ_user} -d ${POSTGRES_DB:-econ_warehouse}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - econ-net

  # ── pgAdmin ───────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bey-zone.com
      PGADMIN_DEFAULT_PASSWORD: beybey
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - econ-net

  # ── Airflow Init ──────────────────────────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "airflow db migrate && airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@econ.local --password $${AIRFLOW_ADMIN_PASSWORD:-admin}"
    restart: on-failure

  # ── Airflow Webserver ─────────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ── Airflow Scheduler ─────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ── Pipeline App Container ────────────────────────────────────────────────
  pipeline:
    build:
      context: ..
      dockerfile: docker/Dockerfile.pipeline
    environment:
      <<: *airflow-env
    volumes:
      - .:/app
    command: tail -f /dev/null # Keep alive for manual execution
    networks:
      - econ-net

  # ── Kestra ───────────────────────────────────────────────────────────────
  kestra:
    image: kestra/kestra:v1.2.8
    user: root
    command: server local
    ports:
      - "8085:8080"
    environment:
      # UI Credentials
      KESTRA_SERVER_BASIC_AUTH_USERNAME: "admin@bey-zone.com"
      KESTRA_SERVER_BASIC_AUTH_PASSWORD: "beybeyB34"
      # Postgres Backend
      KESTRA_DATASOURCES_POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-econ_warehouse}
      KESTRA_DATASOURCES_POSTGRES_USERNAME: ${POSTGRES_USER:-econ_user}
      KESTRA_DATASOURCES_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
      # Pipeline Secrets (using ENV_ prefix for Kestra OSS compatibility)
      ENV_BEA_API_KEY: ${BEA_API_KEY:-}
      ENV_FRED_API_KEY: ${FRED_API_KEY:-}
      ENV_BLS_API_KEY: ${BLS_API_KEY:-}
      ENV_AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      ENV_AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      ENV_DELTA_S3_PATH: ${DELTA_S3_PATH:-}
      ENV_POSTGRES_HOST: "postgres"
      ENV_POSTGRES_DB: "${POSTGRES_DB:-econ_warehouse}"
      ENV_POSTGRES_USER: "${POSTGRES_USER:-econ_user}"
      ENV_POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-localdev}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./tmp:/tmp
      - ..:/project
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - econ-net

volumes:
  postgres-data:
  airflow-logs:


networks:
  econ-net:
    driver: bridge
